<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JLRK 리테일러">
  <title>JLRK 리테일러 프로그램</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

<header class="header">
<div class="title-box">
  <h1 class="title">JLRK 리테일러 프로그램</h1>
  <span class="title-sub" id="titleSub">Retailer Programme</span>
</div>
</header>

    <!-- 프로그램 선택 -->
    <div class="menu-wrap" id="menuWrap" style="display:none;">
      <button class="menu-card" data-go="accident">
        <span class="menu-icon">🚗</span>
        <span class="menu-text">
          <span class="menu-title">사고차 지원금 프로그램</span>
          <span class="menu-sub">Accident Repair · 차량 1건씩 접수</span>
        </span>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-card" data-go="repair">
        <span class="menu-icon">🔧</span>
        <span class="menu-text">
          <span class="menu-title">수리 지원 프로그램</span>
          <span class="menu-sub">Repair Support · 차량 1건씩 접수</span>
        </span>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-card" data-go="forecast">
        <span class="menu-icon">📊</span>
        <span class="menu-text">
          <span class="menu-title">Parts Wholesale 예상마감치 입력</span>
          <span class="menu-sub">매월 1회 · 지점 단위 제출</span>
        </span>
        <span class="menu-arrow">›</span>
      </button>
    </div>

    <button class="back-btn" id="backBtn" style="display:none;">← 프로그램 선택으로</button>

    <div class="loading-wrap" id="loadingWrap">
      <span class="loading-text">불러오는 중...</span>
    </div>

    <div class="form-wrap" id="formWrap" style="display:none;">

      <div class="field">
        <label class="label">Workshop Select</label>
        <div class="select-wrap">
          <select id="workshopSelect" class="select">
            <option value="">선택해주세요</option>
          </select>
        </div>
      </div>

      <div class="field" id="repairTypeField" style="display:none;">
        <label class="label">Repair Type</label>
        <div class="select-wrap">
          <select id="repairTypeSelect" class="select">
            <option value="">선택해주세요</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label">Vehicle Number</label>
        <input
          type="text"
          id="vehicleNumberInput"
          class="date-input"
          placeholder="예: 12가 3456"
          autocomplete="off"
        >
      </div>

      <div class="field">
        <label class="label">Comment<span class="label-sub">선택</span></label>
        <input
          type="text"
          id="commentInput"
          class="date-input"
          placeholder="메모 / 차량 정보 등"
          autocomplete="off"
        >
      </div>

      <div class="field">
        <label class="label">Planned Repair Start Date<span class="label-sub">선택</span></label>
        <input type="date" id="plannedStartDateInput" class="date-input">
      </div>

      <div class="field">
        <label class="label">Total Repair Cost (Before)<span class="label-sub">선택 · 원</span></label>
        <input
          type="number"
          id="totalRepairCostBeforeInput"
          class="date-input"
          placeholder="0"
          inputmode="numeric"
          min="0"
        >
      </div>

      <div class="field">
        <label class="label">Total Parts Cost<span class="label-sub">선택 · 원</span></label>
        <input
          type="number"
          id="totalPartsCostInput"
          class="date-input"
          placeholder="0"
          inputmode="numeric"
          min="0"
        >
      </div>

      <div class="field">
        <label class="label">Retailer Support Cost<span class="label-sub">선택 · 원</span></label>
        <input
          type="number"
          id="retailerSupportCostInput"
          class="date-input"
          placeholder="0"
          inputmode="numeric"
          min="0"
        >
      </div>

      <div class="field">
        <label class="label">JLRK Support Cost<span class="label-sub">선택 · 원</span></label>
        <input
          type="number"
          id="jlrkSupportCostInput"
          class="date-input"
          placeholder="0"
          inputmode="numeric"
          min="0"
        >
      </div>

      <div class="field">
        <label class="label">Files & Media<span class="label-sub">선택</span></label>
        <div class="file-wrap">
          <input type="file" id="fileInput" class="file-input-hidden" accept="image/*,.pdf,.xlsx,.xls,.csv,.doc,.docx">
          <button type="button" id="fileBtn" class="file-btn">파일 선택</button>
          <span id="fileName" class="file-name">선택된 파일 없음</span>
        </div>
      </div>

      <button id="saveBtn" class="save-btn">저장</button>
      <div id="status" class="status"></div>

    </div>

    <!-- Parts Wholesale 예상마감치 -->
    <div class="form-wrap" id="forecastWrap" style="display:none;">
      <div class="notice" id="forecastMonth">기준 월 확인 중...</div>

      <div class="field">
        <label class="label">Workshop Select</label>
        <div class="select-wrap">
          <select id="fcWorkshop" class="select">
            <option value="">선택해주세요</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label">이번달 예상 Parts Wholesale<span class="label-sub">원</span></label>
        <input type="text" id="fcParts" class="date-input" placeholder="0" inputmode="numeric" autocomplete="off">
      </div>

      <div class="field">
        <label class="label">이번달 예상 Warranty<span class="label-sub">원</span></label>
        <input type="text" id="fcWarranty" class="date-input" placeholder="0" inputmode="numeric" autocomplete="off">
      </div>

      <div class="field">
        <label class="label">재고 (Warehouse stock)<span class="label-sub">원</span></label>
        <input type="text" id="fcStock" class="date-input" placeholder="0" inputmode="numeric" autocomplete="off">
      </div>

      <div class="field">
        <label class="label">NCE 승인 대기 금액<span class="label-sub">원</span></label>
        <input type="text" id="fcNce" class="date-input" placeholder="0" inputmode="numeric" autocomplete="off">
      </div>

      <div class="field">
        <label class="label">DMS 추가로 청구할 금액<span class="label-sub">원</span></label>
        <input type="text" id="fcDms" class="date-input" placeholder="0" inputmode="numeric" autocomplete="off">
      </div>

      <button id="fcSaveBtn" class="save-btn">제출</button>
      <div id="fcStatus" class="status"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="forecast.js"></script>
</body>
</html>
